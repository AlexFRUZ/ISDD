    source: методичні рекомендації
  - id: C2
    type: constraint
    text: ІС повинна обмінюватися даними про рецепти лише через API реєстру ЕСОЗ.
    source: системний запит
  - id: C3
    type: constraint
    text: ІС повинна використовувати SQLite як СУБД навчального прототипу.
    source: методичні рекомендації
