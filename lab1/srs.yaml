project: ІС «Мережа аптек»

system_request:
  sponsor: директор мережі аптек
  business_need: >
    Мережі потрібен єдиний облік залишків і формалізоване резервування, щоб зменшити
    навантаження на фармацевтів, прибрати подвійне введення рецептів і скоротити
    втрати через прострочення партій.
  business_requirements:
    - пошук препаратів у наявності в усіх аптеках мережі
    - резервування препаратів із контролем строку дії
    - продаж за електронним рецептом із перевіркою й погашенням у реєстрі
    - партійний облік залишків зі строками придатності
    - звітність про продажі для керівництва
  business_value:
    - зменшення телефонних запитів про наявність із 40 до 12 на зміну (-70 %)
    - зменшення суми списань через прострочення на 15 % на рік
    - скорочення операції за рецептом із 6 до 2 хвилин
    - кращий сервіс і лояльність покупців (невідчутна вигода)
  constraints:
    - обмін даними про рецепти лише через API реєстру ЕСОЗ
    - обробка персональних даних відповідно до закону
    - навчальний прототип реалізується мовою Python 3.10 або новішою

stakeholders:
  - Покупець
  - Фармацевт
  - Завідувач аптеки
  - Директор мережі
  - Реєстр е-рецептів (ЕСОЗ)
  - SMS-шлюз

user_stories:
  - id: US-01
    text: Як покупець, я хочу знайти препарат у наявності за назвою, щоб не телефонувати в кожну аптеку.
  - id: US-02
    text: Як покупець, я хочу зарезервувати препарат у вибраній аптеці, щоб бути певним, що він мене дочекається.
  - id: US-03
    text: Як покупець, я хочу скасувати резервування, щоб звільнити товар, якщо план змінився.
  - id: US-04
    text: Як покупець, я хочу отримати сповіщення про готовність резерву, щоб приїхати вчасно.
  - id: US-05
    text: Як фармацевт, я хочу видавати резерв за кодом, щоб не шукати записи в зошиті.
  - id: US-06
    text: Як фармацевт, я хочу оформлювати продаж за е-рецептом в одній програмі, щоб не вводити дані двічі.
  - id: US-07
    text: Як завідувач аптеки, я хочу реєструвати поставки партій, щоб залишки в системі відповідали полицям.
  - id: US-08
    text: Як завідувач аптеки, я хочу бачити партії, строк придатності яких завершується, щоб вчасно їх реалізувати.
  - id: US-09
    text: Як директор мережі, я хочу отримувати звіт про продажі за період, щоб порівнювати аптеки між собою.

requirements:
  - id: R1
    type: functional
    text: >
      ІС повинна надавати покупцю пошук препаратів у наявності за торговою
      або міжнародною непатентованою назвою.
    priority: 1
    source: US-01
  - id: R1.1
    parent: R1
    type: functional
    text: ІС повинна показувати перелік аптек із доступним залишком і ціною препарату.
    priority: 1
    source: US-01
  - id: R1.2
    parent: R1
    type: functional
    text: ІС повинна фільтрувати результати пошуку за містом.
    priority: 3
    source: інтерв'ю із завідувачем аптеки
  - id: R1.3
    parent: R1
    type: functional
    text: >
      ІС повинна пропонувати аналоги з тією самою міжнародною непатентованою назвою,
      якщо шуканого препарату немає в наявності.
    priority: 2
    source: інтерв'ю із завідувачем аптеки
  - id: R2
    type: functional
    text: ІС повинна дозволяти покупцю резервувати препарат у вибраній аптеці.
    priority: 1
    source: US-02
  - id: R2.1
    parent: R2
    type: functional
    text: ІС повинна відмовляти в резервуванні покупцю, який уже має 3 активні резервування.
    priority: 1
    source: інтерв'ю із завідувачем аптеки
  - id: R2.2
    parent: R2
    type: functional
    text: ІС повинна приймати резервування лише на кількість від 1 до 5 упаковок.
    priority: 1
    source: інтерв'ю із завідувачем аптеки
  - id: R2.3
    parent: R2
    type: functional
    text: ІС повинна зменшувати доступний залишок на зарезервовану кількість на час дії резервування.
    priority: 1
    source: US-02
  - id: R2.4
    parent: R2
    type: functional
    text: ІС повинна вимагати номер чинного електронного рецепта для резервування рецептурного препарату.
    priority: 2
    source: інтерв'ю із завідувачем аптеки
  - id: R2.5
    parent: R2
    type: functional
    text: >
      ІС повинна закріплювати за резервуванням партію з найближчим строком придатності,
      залишковий строк якої становить не менше 30 днів.
    priority: 2
    source: інтерв'ю із завідувачем аптеки
  - id: R3
    type: functional
    text: ІС повинна дозволяти покупцю скасовувати власне активне резервування.
    priority: 2
    source: US-03
  - id: R4
    type: functional
    text: ІС повинна анулювати резервування, не видане протягом 24 годин від створення.
    priority: 1
    source: інтерв'ю із завідувачем аптеки
  - id: R4.1
    parent: R4
    type: functional
    text: ІС повинна повертати кількість анульованого резервування до доступного залишку.
    priority: 1
    source: інтерв'ю із завідувачем аптеки
  - id: R4.2
    parent: R4
    type: functional
    text: ІС повинна дозволяти фармацевту один раз продовжити резервування на 24 години.
    priority: 3
    source: інтерв'ю із завідувачем аптеки
  - id: R5
    type: functional
    text: ІС повинна дозволяти фармацевту видавати зарезервований препарат за кодом резервування.
    priority: 1
    source: US-05
  - id: R6
    type: functional
    text: ІС повинна дозволяти фармацевту продавати препарат за електронним рецептом.
    priority: 1
    source: US-06
  - id: R6.1
