    text: ІС повинна показувати результати пошуку препарату не довше ніж за 2 с при 200 одночасних користувачах.
    priority: 1
    source: інтерв'ю із завідувачем аптеки
  - id: N2
    type: performance
    text: >
      ІС повинна оформлювати продаж не довше ніж за 5 с без урахування часу
