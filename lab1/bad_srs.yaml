  - id: R9
    type: functional
    text: ІС повинна зберігати залишки в таблиці MySQL.
    priority: 2
    source: US-01
  # 11. Префікс не відповідає типу.
  - id: R10
    type: security
    text: ІС повинна блокувати обліковий запис після 5 невдалих спроб входу.
    priority: 2
