    type: functional
    text: Покупець зручно шукає препарат.
    priority: 9
    source: US-01
  # 7. Підвимога не продовжує ID батька, а також підвимога без батька.
  - id: R5.1
    parent: R1
    type: functional
    text: ІС повинна показувати покупцю адресу кожної аптеки.
    priority: 2
