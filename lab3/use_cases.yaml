# Модель варіантів використання ІС «Мережа аптек» (структура за таблицею 3.2).
subsystems:
  Резервування: reservation
  Продаж: sales
  Склад і звітність: warehouse

actors:
  - {name: Покупець, kind: human}
  - {name: Працівник аптеки, kind: human}
  - {name: Фармацевт, kind: human, parent: Працівник аптеки}
  - {name: Завідувач аптеки, kind: human, parent: Працівник аптеки}
  - {name: Директор мережі, kind: human}
  - {name: Реєстр е-рецептів, kind: system}
  - {name: SMS-шлюз, kind: system}

use_cases:
  - id: UC1
    name: Шукати препарат
    actors: [Покупець, Працівник аптеки]
    subsystem: Резервування
    requirements: [R1, R1.1, R1.2, R1.3, N1]
    tucbw: покупець вводить назву препарату на сторінці пошуку
    tucew: покупець бачить перелік аптек із залишком і ціною або перелік аналогів
    effort: 3
    depends_on: []
  - id: UC2
    name: Зарезервувати препарат
    actors: [Покупець]
    subsystem: Резервування
    requirements: [R2, R2.1, R2.2, R2.3, R2.4, R2.5, R4, R4.1]
    include: [UC9]
    extend: [UC1]
    tucbw: покупець обирає аптеку й кількість у результатах пошуку
    tucew: покупець отримує код резервування зі строком дії
    effort: 5
    depends_on: [UC1]
  - id: UC3
    name: Скасувати резервування
    actors: [Покупець]
    subsystem: Резервування
    requirements: [R3]
    tucbw: покупець відкриває власне активне резервування
    tucew: покупець бачить підтвердження скасування
    effort: 1
    depends_on: [UC2]
  - id: UC4
    name: Підготувати резерв
    actors: [Фармацевт, SMS-шлюз]
    subsystem: Резервування
    requirements: [R12]
    tucbw: фармацевт відкриває перелік нових резервувань своєї аптеки
    tucew: покупець отримує сповіщення про готовність резерву
    effort: 2
    depends_on: [UC2]
  - id: UC5
    name: Продовжити резервування
    actors: [Фармацевт]
    subsystem: Резервування
    requirements: [R4.2]
    tucbw: фармацевт вводить код резервування на прохання покупця
    tucew: фармацевт бачить новий строк дії резервування
    effort: 1
    depends_on: [UC4]
  - id: UC6
    name: Видати резерв
    actors: [Фармацевт]
    subsystem: Продаж
    requirements: [R5, R8, N5]
    tucbw: фармацевт вводить код резервування, який назвав покупець
    tucew: покупець отримує препарат і чек
    effort: 2
    depends_on: [UC4]
  - id: UC7
    name: Продати за е-рецептом
    actors: [Фармацевт, Реєстр е-рецептів]
    subsystem: Продаж
    requirements: [R6, R6.1, R6.2, R6.3, R6.4, R6.5, R8, R8.1, N2, N5]
    include: [UC9]
    tucbw: фармацевт вводить номер рецепта, який назвав покупець
    tucew: покупець отримує препарат і чек або причину відмови
    effort: 5
    depends_on: [UC9]
  - id: UC8
    name: Продати безрецептурний препарат
    actors: [Фармацевт]
    subsystem: Продаж
    requirements: [R7, R7.1, R8, R8.1, N2, N5]
    tucbw: фармацевт обирає препарат і кількість
    tucew: покупець отримує препарат і чек
    effort: 2
    depends_on: []
  - id: UC9
    name: Перевірити е-рецепт
    actors: [Реєстр е-рецептів]
    subsystem: Продаж
    requirements: [R2.4, R6.1, R6.2]
    tucbw: ІС надсилає номер рецепта до реєстру
    tucew: ІС отримує статус рецепта від реєстру
    effort: 2
    depends_on: []
  - id: UC10
    name: Прийняти поставку
    actors: [Завідувач аптеки]
    subsystem: Склад і звітність
    requirements: [R9]
    tucbw: завідувач аптеки вводить номер накладної постачальника
    tucew: завідувач аптеки бачить партії поставки в залишках аптеки
    effort: 3
    depends_on: []
  - id: UC11
    name: Списати партію
    actors: [Завідувач аптеки]
    subsystem: Склад і звітність
    requirements: [R10]
    tucbw: завідувач аптеки обирає партію та причину списання
    tucew: завідувач аптеки бачить партію зі списаним залишком
    effort: 1
    depends_on: [UC10]
  - id: UC12
    name: Переглянути строки придатності
    actors: [Завідувач аптеки]
    subsystem: Склад і звітність
    requirements: [R13]
    tucbw: завідувач аптеки відкриває перелік партій аптеки
    tucew: завідувач аптеки бачить партії, строк яких завершується протягом 30 днів
    effort: 1
    depends_on: [UC10]
  - id: UC13
    name: Сформувати звіт про продажі
    actors: [Завідувач аптеки, Директор мережі]
    subsystem: Склад і звітність
    requirements: [R11]
    tucbw: користувач обирає період звіту
    tucew: користувач отримує звіт про продажі за період
    effort: 3
    depends_on: [UC8]
