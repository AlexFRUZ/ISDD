package: pharmacy
layers:
  - ui
  - controllers
  - network
  - persistence
  - domain
  - foundation
allowed:
  ui: [controllers, foundation]
  controllers: [network, persistence, domain, foundation]
  network: [domain]
  persistence: [domain]
  domain: [foundation]
  foundation: []
forbidden_modules:
  domain: [sqlite3, argparse, pickle, json, flask, fastapi]
  foundation: [sqlite3, argparse, pickle, flask, fastapi]
  controllers: [sqlite3, argparse]
